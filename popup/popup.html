<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unhooked</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <nav class="rail" aria-label="Sites">
      <div class="brand">
        <img src="../icons/icon.svg" width="22" height="22" alt="" />
        <span>unhooked</span>
      </div>
      <fieldset class="sites" id="sitePicker">
        <legend class="visually-hidden">Site</legend>
      </fieldset>
      <div class="rail-foot">
        <button type="button" class="pause" id="btnPower" aria-pressed="true">
          <span class="icon-power" aria-hidden="true"></span><span id="powerLabel">Pause all</span>
        </button>
        <div class="rail-links">
          <button type="button" class="theme" id="btnTheme" aria-label="Cycle theme">
            <span class="icon-theme" aria-hidden="true"></span>
          </button>
          <a
            href="https://github.com/Priyansh4444/unhooked"
            target="_blank"
            rel="noopener noreferrer"
            >Source</a
          >
        </div>
      </div>
    </nav>

    <div class="pane">
      <header class="site-head">
        <div class="site-title">
          <div>
            <h1 id="siteName">Loading</h1>
            <p id="siteState">Loading your choices</p>
          </div>
          <input id="siteEnabled" type="checkbox" class="uh-switch" aria-describedby="siteState" />
        </div>
        <p id="pausedNote" class="paused-note" hidden>
          Paused on every site. <button type="button" id="btnResume">Resume</button>
        </p>
        <div class="presets" role="group" aria-labelledby="presetLabel">
          <span id="presetLabel">Preset</span>
          <button type="button" data-preset="balanced" title="Quiet the feeds">Balanced</button>
          <button type="button" data-preset="focused" title="Turn every control on">Focus</button>
          <button type="button" data-preset="clear" title="Turn every control off">Show all</button>
        </div>
      </header>
      <main>
        <div class="sections" id="youtubeControls">
          <label class="row leaf">
            <span class="row-label">Hide home feed</span>
            <input type="checkbox" class="uh-switch" id="hideHomeFeed" />
          </label>

          <section class="group" data-group="sidebar">
            <div class="group-head">
              <label class="row parent">
                <span class="row-label">Hide video sidebar</span>
                <input type="checkbox" class="uh-switch" id="bulkVideoSidebar" />
              </label>
              <button
                type="button"
                class="collapse-btn"
                aria-expanded="true"
                aria-label="Collapse section"
              ></button>
            </div>
            <div class="group-children">
              <label class="row child">
                <span class="row-label">Hide recommended</span>
                <input type="checkbox" class="uh-switch" id="hideRelatedSidebar" />
              </label>
              <label class="row child">
                <span class="row-label">Hide live chat</span>
                <input type="checkbox" class="uh-switch" id="hideLiveChat" />
              </label>
              <label class="row child">
                <span class="row-label">Hide playlist</span>
                <input type="checkbox" class="uh-switch" id="hidePlaylistSidebar" />
              </label>
              <label class="row child">
                <span class="row-label">Hide fundraiser</span>
                <input type="checkbox" class="uh-switch" id="hideFundraiser" />
              </label>
            </div>
          </section>

          <label class="row leaf">
            <span class="row-label">Hide end screen feed</span>
            <input type="checkbox" class="uh-switch" id="hideEndScreenFeed" />
          </label>
          <label class="row leaf">
            <span class="row-label">Hide end screen cards</span>
            <input type="checkbox" class="uh-switch" id="hideEndScreenCards" />
          </label>

          <label class="row leaf">
            <span class="row-label">Hide Shorts</span>
            <input type="checkbox" class="uh-switch" id="hideShorts" />
          </label>

          <section class="group" data-group="comments">
            <div class="group-head">
              <label class="row parent">
                <span class="row-label">Hide comments</span>
                <input type="checkbox" class="uh-switch" id="hideComments" />
              </label>
              <button
                type="button"
                class="collapse-btn"
                aria-expanded="true"
                aria-label="Collapse section"
              ></button>
            </div>
            <div class="group-children">
              <label class="row child">
                <span class="row-label">Hide profile photos</span>
                <input type="checkbox" class="uh-switch" id="hideCommentAvatars" />
              </label>
            </div>
          </section>

          <label class="row leaf">
            <span class="row-label">Hide mixes</span>
            <input type="checkbox" class="uh-switch" id="hideMixes" />
          </label>

          <label class="row leaf">
            <span class="row-label">Hide merch, tickets, offers</span>
            <input type="checkbox" class="uh-switch" id="hideMerchTicketsOffers" />
          </label>

          <section class="group" data-group="videoInfo">
            <div class="group-head">
              <label class="row parent">
                <span class="row-label">Hide video info</span>
                <input type="checkbox" class="uh-switch" id="bulkVideoInfo" />
              </label>
              <button
                type="button"
                class="collapse-btn"
                aria-expanded="true"
                aria-label="Collapse section"
              ></button>
            </div>
            <div class="group-children">
              <label class="row child">
                <span class="row-label">Hide buttons bar</span>
                <input type="checkbox" class="uh-switch" id="hideVideoActionsBar" />
              </label>
              <label class="row child">
                <span class="row-label">Hide channel</span>
                <input type="checkbox" class="uh-switch" id="hideChannelRow" />
              </label>
              <label class="row child">
                <span class="row-label">Hide description</span>
                <input type="checkbox" class="uh-switch" id="hideDescription" />
              </label>
            </div>
          </section>

          <section class="group" data-group="topHeader">
            <div class="group-head">
              <label class="row parent">
                <span class="row-label">Hide top header</span>
                <input type="checkbox" class="uh-switch" id="bulkTopHeader" />
              </label>
              <button
                type="button"
                class="collapse-btn"
                aria-expanded="true"
                aria-label="Collapse section"
              ></button>
            </div>
            <div class="group-children">
              <label class="row child">
                <span class="row-label">Hide notifications</span>
                <input type="checkbox" class="uh-switch" id="hideNotificationBell" />
              </label>
            </div>
          </section>

          <label class="row leaf">
            <span class="row-label">Hide inapt search results</span>
            <input type="checkbox" class="uh-switch" id="hideInaptSearchResults" />
          </label>

          <label class="row leaf">
            <span class="row-label">Hide explore, trending</span>
            <input type="checkbox" class="uh-switch" id="hideTrendingNav" />
          </label>

          <label class="row leaf">
            <span class="row-label">Hide more from YouTube</span>
            <input type="checkbox" class="uh-switch" id="hideMoreFromYoutube" />
          </label>

          <label class="row leaf">
            <span class="row-label">Hide subscriptions</span>
            <input type="checkbox" class="uh-switch" id="hideSubscriptionsNav" />
          </label>

          <label class="row leaf">
            <span class="row-label">Disable autoplay</span>
            <input type="checkbox" class="uh-switch" id="disableAutoplay" />
          </label>

          <label class="row leaf">
            <span class="row-label">Disable annotations</span>
            <input type="checkbox" class="uh-switch" id="disableAnnotations" />
          </label>
        </div>
        <div class="sections" id="socialControls" hidden></div>
      </main>
      <footer class="foot">
        <p id="saveStatus" role="status" aria-live="polite">Loading your choices…</p>
        <button type="button" id="resetAll">Reset site</button>
      </footer>
    </div>

    <script src="../shared/options.js"></script>
    <script src="../shared/sites.js"></script>
    <script src="../shared/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
