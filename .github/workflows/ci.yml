name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, lint and format
        run: bun run check

      - name: Unit tests
        run: bun test

      - name: Package every browser
        run: bun run package

      - name: Install browsers
        run: |
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Chromium (not branded Chrome) still loads unpacked extensions from the command line.
          echo "CHROME_PATH=$(bunx @puppeteer/browsers install chromium@latest --path "$RUNNER_TEMP/browsers" | tail -1 | cut -d' ' -f2-)" >> "$GITHUB_ENV"
          echo "FIREFOX_PATH=$(bunx @puppeteer/browsers install firefox@stable --path "$RUNNER_TEMP/browsers" | tail -1 | cut -d' ' -f2-)" >> "$GITHUB_ENV"

      # Suites against stubbed pages only; the live-site suites run locally (see CONTRIBUTING.md).
      - name: End-to-end (Chromium, minified)
        env:
          MINIFY: "1"
        run: bun e2e/run.mjs chrome smoke social youtube-controls popup picker wand twitter twitch

      - name: End-to-end (Firefox, minified)
        env:
          MINIFY: "1"
        run: bun e2e/run.mjs firefox smoke social youtube-controls wand twitter twitch

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unhooked
          path: dist/*.zip
