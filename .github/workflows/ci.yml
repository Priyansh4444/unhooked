name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned, because each version minifies a little differently and sizes are compared with a record.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, lint and format
        run: bun run check

      - name: Unit tests
        run: bun test

      - name: Package every browser
        run: bun run package

      - name: Size budget
        run: bun run size

      - name: Install browsers
        run: |
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Chromium (not branded Chrome) still loads unpacked extensions from the command line.
          echo "CHROME_PATH=$(bunx @puppeteer/browsers install chromium@latest --path "$RUNNER_TEMP/browsers" | tail -1 | cut -d' ' -f2-)" >> "$GITHUB_ENV"
          echo "FIREFOX_PATH=$(bunx @puppeteer/browsers install firefox@stable --path "$RUNNER_TEMP/browsers" | tail -1 | cut -d' ' -f2-)" >> "$GITHUB_ENV"

      # Suites against stubbed pages only; the live-site suites run locally (see CONTRIBUTING.md).
      - name: End-to-end (Chromium, minified)
        env:
          MINIFY: "1"
        run: bun e2e/run.mjs chrome smoke social youtube-controls popup transfer film film-access time picker wand skip twitter twitch

      - name: End-to-end (Firefox, minified)
        env:
          MINIFY: "1"
        run: bun e2e/run.mjs firefox smoke social youtube-controls film time wand skip twitter twitch

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unhooked
          path: dist/*.zip

  # Times only mean something side by side, so this runs the code before the change as well.
  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "CHROME_PATH=$(bunx @puppeteer/browsers install chromium@latest --path "$RUNNER_TEMP/browsers" | tail -1 | cut -d' ' -f2-)" >> "$GITHUB_ENV"

      - name: Bench against the base of this pull request
        run: bun scripts/bench.ts --check --compare ${{ github.event.pull_request.base.sha }}
